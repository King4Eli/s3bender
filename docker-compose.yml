name: s3bender
services:
  s3bender:
    container_name: s3bender
    image: s3bender:latest
    ports:
      - "8080:8080"
    env_file:
      - .env/engine.env
    volumes:
      - file-storage:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  file-storage:
