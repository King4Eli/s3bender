name: s3bender
services:
  s3bender:
    container_name: s3bender
    image: ghcr.io/king4eli/s3bender:${IMAGE_TAG:-latest}
    ports:
      - "9066:8080" #api
      - "9067:8081" # frontend
    env_file:
      - .env/engine.env
    volumes:
      - file-storage:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
 

volumes:
  file-storage:
