server:
  port: 8080

spring:
  application:
    name: s3bender
  datasource:
    url: jdbc:h2:file:${S3BENDER_DB_PATH:./data/db/s3bender};MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
  mvc:
    formcontent:
      filter:
        # Object PUT bodies are raw bytes, never a form - this filter would otherwise consume
        # the request body itself when a client sends Content-Type: application/x-www-form-urlencoded.
        enabled: false

s3bender:
  storage:
    root: ${S3BENDER_STORAGE_ROOT:./data/objects}
  auth:
    admin-api-key: ${S3BENDER_ADMIN_API_KEY:}
    master-key: ${S3BENDER_MASTER_KEY:}
  signing:
    clock-skew-seconds: ${S3BENDER_CLOCK_SKEW_SECONDS:900}
    max-presign-expiry-seconds: ${S3BENDER_MAX_PRESIGN_EXPIRY_SECONDS:604800}

logging:
  level:
    com.s3bender: INFO
