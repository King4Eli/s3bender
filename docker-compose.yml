name: s3bender
services:
  s3bender-engine:
    container_name: s3bender-engine
    image: s3bender-engine:latest
    ports:
      - "8080:8080" #api
      - "8081:8081" # frontend
    env_file:
      - .env/engine.env
    volumes:
      - file-storage:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
 

volumes:
  file-storage:
