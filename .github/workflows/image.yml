# Tests the engine, then builds the Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/s3bender
#
# - push to main     -> :latest, :main, :sha-<short>
# - push tag v1.2.3  -> :1.2.3, :1.2, :1, :sha-<short>
# - pull request     -> test + build only (nothing is pushed)
# - manual run       -> same as the branch it's run on
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7

      # QEMU only runs the runtime stage's tiny RUN step for arm64; Go itself cross-compiles.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # ghcr.io requires a lowercase image name.
          images: ghcr.io/${{ github.repository_owner }}/s3bender
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          labels: |
            org.opencontainers.image.title=s3bender
            org.opencontainers.image.description=Self-hosted object storage with per-bucket credentials

      - uses: docker/build-push-action@v7
        with:
          context: engine
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
